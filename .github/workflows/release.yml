# Installers for a tagged release.
#
# Windows installers cannot be cross-compiled from Linux — the toolchain, the
# webview headers and the NSIS packaging all want to run there — so the matrix
# is the only way to produce them at all, and it costs nothing to build the
# Linux ones the same way.
#
# Triggered by a tag, and by hand for a dry run before committing to one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One platform failing should not throw away the other's artifacts —
      # a Linux build that worked is still worth having.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            # This was 22.04, on the reasoning that glibc is backwards
            # compatible and not forwards, so building on the oldest sensible
            # Ubuntu keeps the binary runnable on the most machines. That
            # reasoning is right in general and did not apply here: the
            # prebuilt onnxruntime `ort-sys` downloads is itself compiled
            # against glibc 2.38 and GCC 13's libstdc++, so it never linked on
            # 22.04 and no Linux build was ever produced —
            # `undefined symbol: __isoc23_strtol` and `_M_replace_cold`.
            #
            # The floor is set by that dependency, not by the runner. Building
            # here on 22.04 could not have produced a binary that ran on
            # glibc 2.35 either; it could only fail. So this costs nothing
            # that was not already spent, and it is the difference between a
            # Linux download existing and not.
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            clang \
            libclang-dev \
            rpm
          # ALSA for the microphone, clang for the speech bindings' bindgen
          # step. Neither failure message mentions audio or speech, so leaving
          # them out sends anyone debugging it a long way in the wrong
          # direction.

      - uses: dtolnay/rust-toolchain@stable

      # See check.yml: the speech libraries live in the user cache, and a
      # restored `target` without them does not link.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "v1-with-speech-libs"
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io
            ~/Library/Caches/sherpa-rs
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/sherpa-rs
            ~/AppData/Local/ort.pyke.io

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check before building
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy resolves the binary's shared libraries by scanning the
          # loader path. The speech runtimes are not on it — they sit beside
          # the binary and are found at run time through an $ORIGIN rpath — so
          # without this the AppImage step fails with "Could not find
          # dependency: libsherpa-onnx-c-api.so" after everything else has
          # already built.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/target/release
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AIgraph ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Downloads are below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
