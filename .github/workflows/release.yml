# The installers this machine cannot make: Windows, and rpm.
#
# Windows installers cannot be cross-compiled from Linux — the toolchain, the
# webview headers and the NSIS packaging all want to run there. rpm could be
# built locally but needs rpmbuild, which this machine does not have. The deb
# and AppImage are still built locally by scripts/release.sh, which is what
# starts this, for the tag it just pushed, once the draft release exists —
# so there is always a release here to upload into.
name: Release

# Not on a tag push: release.sh force-pushes the tag, and a push-triggered run
# would race it to the release. It dispatches this itself instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to, e.g. v0.6.3"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      # One platform failing should not throw away the other's installers.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            # Not 22.04: the prebuilt onnxruntime `ort-sys` downloads is
            # compiled against glibc 2.38 and GCC 13's libstdc++, so it never
            # links there (`undefined symbol: __isoc23_strtol`). The floor is
            # set by that dependency, not by the runner.
            bundles: rpm
            files: src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            bundles: nsis,msi
            files: src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            clang \
            libclang-dev \
            rpm
          # ALSA for the microphone, clang for the speech bindings' bindgen
          # step. Neither failure message mentions audio or speech, so leaving
          # them out sends anyone debugging it a long way in the wrong
          # direction.

      - uses: dtolnay/rust-toolchain@stable

      # See check.yml: the speech libraries live in the user cache, and a
      # restored `target` without them does not link.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "v1-with-speech-libs"
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io
            ~/AppData/Local/sherpa-rs
            ~/AppData/Local/ort.pyke.io

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # No checks or tests here: release.sh ran them all before tagging.

      # A restored `target` can come back without the speech libraries beside
      # the binaries, and cargo will not rerun the build script that copies
      # them there. Cleaning just this crate reruns that script; the download
      # itself is in the cache above.
      - name: Put the speech libraries back into target
        if: matrix.platform == 'ubuntu-24.04'
        run: cargo clean -p sherpa-rs-sys
        working-directory: src-tauri

      # The installer has to carry the sherpa-onnx DLLs beside the exe, or the
      # app will not start ("sherpa-onnx-c-api.dll not found"). Tauri checks
      # bundled resources at compile time, in every profile, so the list
      # cannot live in tauri.windows.conf.json permanently: `tauri dev` on
      # Windows would fail on files that only exist after a release build. So
      # build the speech library in release first — its build script copies
      # the DLLs into target/release — and only then switch the list on.
      - name: Stage the speech DLLs for the Windows installer
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: bash
        run: |
          cargo build --release -p sherpa-rs-sys
          cp tauri.windows-bundle.conf.json tauri.windows.conf.json

      - name: Build the installers
        shell: bash
        run: npm run package -- --bundles ${{ matrix.bundles }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" ${{ matrix.files }} --clobber
