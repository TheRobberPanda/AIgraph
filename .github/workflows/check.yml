# Every push: the things that would embarrass a release if they broke.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 24.04, not 22.04 — see the note in release.yml. The prebuilt
    # onnxruntime that `ort-sys` downloads is compiled against glibc 2.38 and
    # libstdc++ from GCC 13, so on 22.04 the test binary does not link at all:
    # `undefined symbol: __isoc23_strtol`, out of libort_sys.rlib, which reads
    # like a test failure (exit 101) and is not one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The speech bindings download their prebuilt libraries into the user
      # cache, not into `target`. Restoring `target` alone marks their build
      # scripts as already run, so nothing re-downloads and the link fails
      # with `unable to find library -lsherpa-onnx-c-api` / `-lonnxruntime`.
      # Cache the downloads with the build; the prefix bump retires the
      # entries saved without them.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "v1-with-speech-libs"
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
