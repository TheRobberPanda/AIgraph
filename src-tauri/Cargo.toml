[package]
name = "idea-graph"
version = "0.1.0"
description = "Think out loud, get a map back"
authors = ["Idea Graph contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "idea_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

async-trait = "0.1"
# Speech recognition and the neural voice. `download-binaries` pulls prebuilt
# sherpa-onnx rather than compiling C++ here; `tts` gives us Piper voices
# through the runtime dictation already brings in, rather than a second one.
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "tts"] }
cpal = "0.18"
fastembed = "6"
tar = "0.4"
ureq = "2"
# Unpacking the prebuilt llama-server. Deflate only — the release archives
# use nothing else, and the other codecs bring C dependencies.
zip = { version = "2", default-features = false, features = ["deflate"] }
bzip2 = "0.4"
# Release archives are gzipped tarballs on Linux and macOS.
flate2 = "1"
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signalling a llama-server left behind by a previous run.
[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
hound = "3"
